name: Live viewer (GitHub Pages)
# Hosts the web build so family can open a live-location link without installing the app.
# Safe to leave as is: if GitHub Pages is not turned on, this run is skipped and stays GREEN.
# To turn it on: repo Settings > Pages > Source = "GitHub Actions", then re-run this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - name: Is GitHub Pages turned on?
        id: p
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Web viewer skipped::GitHub Pages is not enabled. Turn it on at Settings > Pages > Source: GitHub Actions to publish the live viewer."
          fi
      - uses: actions/checkout@v4
        if: steps.p.outputs.on == 'true'
      - uses: actions/setup-node@v4
        if: steps.p.outputs.on == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.p.outputs.on == 'true'
      - run: npm run build
        if: steps.p.outputs.on == 'true'
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: steps.p.outputs.on == 'true'
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
        if: steps.p.outputs.on == 'true'
